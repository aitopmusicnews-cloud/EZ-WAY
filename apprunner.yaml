version: 1.0
runtime: python311
build:
  commands:
    build:
      - pip install -r local_lyric_optimizer/requirements.txt
run:
  command: uvicorn local_lyric_optimizer.app:app --host 0.0.0.0 --port 8080
  network:
    port: 8080
    env: APP_PORT
  env:
    - name: LYRIC_SERVICE_HOST
      value: "0.0.0.0"
    - name: LYRIC_SERVICE_PORT
      value: "8080"
    - name: AWS_REGION
      value: "us-west-2"
