name: Upload Drag-and-Drop Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/components/UploadZone.tsx'
      - 'src/services/uploadFileAcceptance.ts'
      - 'src/services/uploadFileAcceptance.test.ts'
      - '.github/workflows/upload-drag-drop-verify.yml'
  workflow_dispatch:

jobs:
  verify-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Upload drag-and-drop regression
        run: node --experimental-strip-types --test src/services/uploadFileAcceptance.test.ts

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build
