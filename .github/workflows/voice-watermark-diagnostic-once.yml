name: UI Status Diagnostic Once

on:
  push:
    branches:
      - refactor/remove-ghost-ui-v2

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/remove-ghost-ui-v2
      - name: Show every synthetic status reference
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('src/App.tsx').read_text().splitlines()
          needles = ('System Status', 'Storage Usage', 'Database Latency', 'API Uptime', 'Cloud Sync Active')
          matches = [(i, line) for i, line in enumerate(source, 1) if any(n in line for n in needles)]
          print(f'status_matches={len(matches)}')
          for i, _ in matches:
              print(f'--- around line {i} ---')
              for n in range(max(1, i - 5), min(len(source), i + 6) + 1):
                  print(f'{n}: {source[n-1]}')
          PY
