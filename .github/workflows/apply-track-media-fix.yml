name: Apply stable track media patch

on:
  push:
    branches:
      - fix/track-zip-stable-media

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/track-zip-stable-media
      - name: Apply patch
        run: |
          if git log -1 --pretty=%B | grep -Fq '[track-media-patch-complete]'; then
            exit 0
          fi
          python scripts/apply-track-media-fix.py
      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add aws/app-data/api/handler.mjs aws/app-data/template.yaml src/services/dataStore.ts src/App.tsx
          git commit -m "fix: refresh track media before ZIP download [track-media-patch-complete]"
          git push origin HEAD:fix/track-zip-stable-media
