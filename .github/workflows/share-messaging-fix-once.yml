name: Share Messaging Fix Once

on:
  push:
    branches:
      - refactor/remove-ghost-ui-v2

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: refactor/remove-ghost-ui-v2
          fetch-depth: 0

      - name: Apply source patch
        run: python scripts/share_messaging_fix.py

      - name: Install dependencies
        run: npm ci

      - name: Verify focused share and messaging behavior
        run: |
          node --experimental-strip-types --test src/services/shareMessagingActions.test.ts
          node --experimental-strip-types --test src/services/trackActionButtons.test.ts
          node --experimental-strip-types --test src/services/buttonAudit.test.ts
          node --check aws/app-data/api/handler.mjs

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix external sharing and portal messaging"
          git push origin HEAD:refactor/remove-ghost-ui-v2
