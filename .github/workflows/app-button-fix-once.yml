name: Apply App Button Fixes Once

on:
  push:
    branches:
      - fix/analyze-track-actions

permissions:
  contents: write

jobs:
  patch-app:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/analyze-track-actions
          fetch-depth: 0

      - name: Wire dead App buttons
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '  const [sortOrder, setSortOrder] = useState<"asc" | "desc">("desc");\n',
                  '  const [sortOrder, setSortOrder] = useState<"asc" | "desc">("desc");\n'
                  '  const [trackStatusFilter, setTrackStatusFilter] = useState<"all" | "ready" | "processing" | "error">("all");\n',
              ),
              (
                  '''    const filtered = tracks.filter((t) => {\n      const q = searchQuery.toLowerCase();\n      return (\n        t.name.toLowerCase().includes(q) ||\n        t.artist.toLowerCase().includes(q) ||\n        t.tags?.some((tag) => tag.toLowerCase().includes(q))\n      );\n    });''',
                  '''    const filtered = tracks.filter((t) => {\n      const q = searchQuery.toLowerCase();\n      const matchesSearch = (\n        t.name.toLowerCase().includes(q) ||\n        t.artist.toLowerCase().includes(q) ||\n        t.tags?.some((tag) => tag.toLowerCase().includes(q))\n      );\n      const matchesStatus = trackStatusFilter === "all" || t.status === trackStatusFilter;\n      return matchesSearch && matchesStatus;\n    });''',
              ),
              (
                  '  }, [tracks, searchQuery, sortBy, sortOrder]);\n',
                  '  }, [tracks, searchQuery, sortBy, sortOrder, trackStatusFilter]);\n',
              ),
              (
                  '''        <button className="px-6 py-3 border border-zinc-900 rounded-2xl flex items-center gap-2 text-zinc-400 hover:text-white transition-colors self-stretch md:self-auto justify-center">\n          <Filter className="w-4 h-4" /> Filters\n        </button>''',
                  '''        <button\n          type="button"\n          onClick={() => setTrackStatusFilter((current) => {\n            const order: Array<"all" | "ready" | "processing" | "error"> = ["all", "ready", "processing", "error"];\n            return order[(order.indexOf(current) + 1) % order.length];\n          })}\n          title={`Status filter: ${trackStatusFilter}`}\n          className="px-6 py-3 border border-zinc-900 rounded-2xl flex items-center gap-2 text-zinc-400 hover:text-white transition-colors self-stretch md:self-auto justify-center"\n        >\n          <Filter className="w-4 h-4" />\n          {trackStatusFilter === "all" ? "Filters" : `Filters: ${trackStatusFilter}`}\n        </button>''',
              ),
              (
                  '''                  <button className="p-3 text-zinc-600 hover:text-white transition-colors">\n                    <Settings className="w-4 h-4" />\n                  </button>''',
                  '''                  <button\n                    type="button"\n                    onClick={() => setEditingClient(activeChatClient)}\n                    className="p-3 text-zinc-600 hover:text-white transition-colors"\n                    title="Edit contact settings"\n                  >\n                    <Settings className="w-4 h-4" />\n                  </button>''',
              ),
              (
                  '''                    <button className="p-3 bg-zinc-900 border border-zinc-800 rounded-xl text-zinc-500 hover:text-rose-500 transition-all hover:scale-110">\n                      <X className="w-4 h-4" />\n                    </button>''',
                  '''                    <button\n                      type="button"\n                      onClick={() => void deleteShareLink(link.id)}\n                      className="p-3 bg-zinc-900 border border-zinc-800 rounded-xl text-zinc-500 hover:text-rose-500 transition-all hover:scale-110"\n                      title="Delete share link"\n                    >\n                      <X className="w-4 h-4" />\n                    </button>''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit source fix and remove one-shot workflow
        run: |
          rm .github/workflows/app-button-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx .github/workflows/app-button-fix-once.yml
          git commit -m "fix: wire remaining app buttons"
          git push origin HEAD:fix/analyze-track-actions
