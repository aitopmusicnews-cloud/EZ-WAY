name: Album Cover Major Label Finish

on:
  push:
    branches:
      - feature/album-cover-major-label-director

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/album-cover-major-label-director
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply approved album-cover changes
        run: python scripts/apply_album_cover_major_label_finish.py
      - name: Frontend regression
        run: node --experimental-strip-types --test src/services/albumCoverIntegration.test.ts
      - name: Commit generated changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add album_cover_backend/app/render_prompts.py album_cover_backend/app/cloudflare_generation_service.py album_cover_backend/tests/test_pipeline.py src/services/albumCoverStudio.ts src/components/AlbumCoverStudio.tsx src/services/albumCoverIntegration.test.ts
          git diff --cached --check
          git commit -m "feat: finish major-label album cover user controls"
          git push origin HEAD:feature/album-cover-major-label-director
