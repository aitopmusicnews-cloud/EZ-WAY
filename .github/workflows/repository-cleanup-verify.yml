name: Repository cleanup verification

on:
  push:
    branches:
      - cleanup/aws-only-data-layer
    paths:
      - .github/workflows/repository-cleanup-verify.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: cleanup/aws-only-data-layer

      - name: Verify obsolete provider text is absent
        shell: bash
        run: |
          LEGACY_PROVIDER="$(printf '7375706162617365' | xxd -r -p)"
          if grep -RniI --exclude-dir=.git --exclude=repository-cleanup-verify.yml "$LEGACY_PROVIDER" .; then
            echo "Obsolete provider references remain in the repository."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Clean install
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build
