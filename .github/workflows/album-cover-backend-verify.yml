name: Album Cover Backend Verify

on:
  push:
    branches:
      - feature/cloudflare-album-cover-backend
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r album_cover_backend/requirements.txt

      - name: Compile backend
        working-directory: album_cover_backend
        run: python -m compileall -q app

      - name: Run Cloudflare renderer regression
        working-directory: album_cover_backend
        run: python -m pytest -q tests/test_flux_image_renderer.py

      - name: Run full backend suite
        working-directory: album_cover_backend
        run: python -m pytest -q tests

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install EZ-WAY dependencies
        run: npm ci

      - name: Run Album Cover integration tests
        run: node --import tsx --test src/services/albumCoverIntegration.test.ts src/services/albumCoverCore.test.ts src/services/albumCoverTitleFont.test.ts

      - name: Run all EZ-WAY Node tests
        shell: bash
        run: |
          mapfile -t tests < <(find src -type f \( -name '*.test.ts' -o -name '*.test.tsx' \) | sort)
          printf 'Running %s test files\n' "${#tests[@]}"
          node --import tsx --test "${tests[@]}"

      - name: Verify Cloudflare secrets are server-only
        shell: bash
        run: |
          if grep -RniE 'CLOUDFLARE_API_TOKEN|CLOUDFLARE_ACCOUNT_ID' src .env.production vite.config.ts; then
            echo 'Cloudflare server credentials must not appear in browser/Vite files.'
            exit 1
          fi
          if grep -Rni 'pollinations' album_cover_backend/app; then
            echo 'Pollinations must not appear in the Album Cover backend provider path.'
            exit 1
          fi

      - name: TypeScript lint
        run: npm run lint

      - name: Production build
        run: npm run build
