name: Album Cover Backend Verify

on:
  push:
    branches:
      - feature/cloudflare-album-cover-backend
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renderer-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pytest-asyncio httpx
      - name: Run Cloudflare renderer contract
        working-directory: album_cover_backend
        run: python -m pytest -q tests/test_flux_image_renderer.py
