name: Ghost UI Cleanup V3 Once

on:
  push:
    branches:
      - refactor/remove-ghost-ui-v2

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/remove-ghost-ui-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Refactor active UI
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing {label}')
              return text.replace(old, new, 1)

          # types.ts
          path = Path('src/types.ts')
          text = path.read_text()
          if 'export type AppView' not in text:
              text = """export type AppView =
            | 'dashboard'
            | 'tracks'
            | 'playlists'
            | 'clients'
            | 'messages'
            | 'sharing'
            | 'activity'
            | 'settings'
            | 'profile'
            | 'client-detail'
            | 'videos'
            | 'youtube'
            | 'analyzer'
            | 'copyrights'
            | 'albumcover';

          """ + text
          path.write_text(text)

          # Shell.tsx
          path = Path('src/components/Shell.tsx')
          text = path.read_text()
          text = once(text, "import { trackNeedsCoverPrompt } from '../services/albumCoverCore';", "import { trackNeedsCoverPrompt } from '../services/albumCoverCore';\nimport type { AppView } from '../types';\nimport type { LucideIcon } from 'lucide-react';", 'Shell imports')
          text = once(text, '  activeView: string;\n  onViewChange: (view: any) => void;', '  activeView: AppView;\n  onViewChange: (view: AppView) => void;', 'Shell navigation props')
          text = once(text, '}\n\nexport default function Shell', "}\n\ninterface ShellNavItem {\n  id: AppView;\n  label: string;\n  icon: LucideIcon;\n}\n\nexport default function Shell", 'ShellNavItem insertion')
          text = once(text, '  const primaryItems = [', '  const primaryItems: ShellNavItem[] = [', 'primaryItems type')
          text = once(text, '  const secondaryItems = [', '  const secondaryItems: ShellNavItem[] = [', 'secondaryItems type')
          text = once(text, "  const profileItem = { id: 'profile', label: 'Profile', icon: User };", "  const profileItem: ShellNavItem = { id: 'profile', label: 'Profile', icon: User };", 'profileItem type')
          text = once(text, '  const handleMobileNav = (viewId: string) => {', '  const handleMobileNav = (viewId: AppView) => {', 'mobile navigation type')
          text = once(text, 'item: (typeof primaryItems)[number];', 'item: ShellNavItem;', 'NavItem type')
          path.write_text(text)

          # VoiceAssistant.tsx
          path = Path('src/components/VoiceAssistant.tsx')
          text = path.read_text()
          text = once(text, "import { cn } from '../lib/utils';", "import { cn } from '../lib/utils';\nimport type { AppView } from '../types';", 'Voice import')
          text = once(text, '  activeView: string;\n  onViewChange: (view: any) => void;', '  activeView: AppView;\n  onViewChange: (view: AppView) => void;', 'Voice navigation props')
          patterns = [
              r"\n\s*if \(clean\.includes\('watermark'\).*?\n\s*}\n",
              r"\n\s*\{\n\s*description: \"engage copyright watermark protection\".*?\n\s*},\n",
          ]
          for pattern in patterns:
              text, count = re.subn(pattern, '\n', text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'watermark block pattern failed: {pattern}')
          text = text.replace(' / <span className="text-zinc-300 font-bold">"Watermark"</span>', '')
          text = text.replace('                      { label: "Copyright Guard", cmd: "go to watermark" }\n', '')
          if re.search(r'watermark', text, re.I):
              raise SystemExit('watermark reference remains in VoiceAssistant')
          path.write_text(text)

          # App.tsx
          path = Path('src/App.tsx')
          text = path.read_text()
          text = once(text, 'import ReleasesHub from "./components/ReleasesHub";\n', '', 'Releases import')
          text = once(text, 'import { Track, ShareLink, Client, Playlist } from "./types";', 'import { Track, ShareLink, Client, Playlist, AppView } from "./types";', 'AppView import')
          text = once(text, 'import { getSupabaseClient, supabaseUrl } from "./lib/supabase";\n', '', 'legacy diagnostics import')
          text, count = re.subn(r'  const \[activeView, setActiveView\] = useState<.*?>\("dashboard"\);', '  const [activeView, setActiveView] = useState<AppView>("dashboard");', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('activeView union replacement failed')
          text = text.replace('        {activeView === "releases" && <ReleasesHub />}\n', '')

          db_start = text.find('  const [dbStatus, setDbStatus] = useState<{')
          db_end = text.find('  // Handle Pollinations BYOP')
          if db_start < 0 or db_end <= db_start:
              raise SystemExit('DB diagnostics state block not found')
          text = text[:db_start] + text[db_end:]
          settings_effect = '  useEffect(() => {\n    if (activeView === "settings") {\n      runDatabaseInspection();\n    }\n  }, [activeView]);\n\n'
          text = once(text, settings_effect, '', 'settings diagnostics effect')

          dashboard = text.find('  const renderDashboard = () => (')
          check = text.find('onClick={checkDatabase}', dashboard)
          button_start = text.rfind('          <button', dashboard, check)
          button_close = text.find('          </button>', check)
          if min(dashboard, check, button_start, button_close) < 0:
              raise SystemExit('Dashboard DB button bounds not found')
          button_end = button_close + len('          </button>')
          if text[button_end:button_end+1] == '\n':
              button_end += 1
          text = text[:button_start] + text[button_end:]

          panel_start = text.find('      {dbStatus?.message && (', dashboard)
          analytics = text.find('      {/* Analytics Grid */}', dashboard)
          if panel_start < 0 or analytics <= panel_start:
              raise SystemExit('Dashboard DB panel bounds not found')
          text = text[:panel_start] + text[analytics:]

          status_start = text.find('        <div className="bg-zinc-950 border border-zinc-900 rounded-[2.5rem] p-8 overflow-hidden">', dashboard)
          status_heading = text.find('System Status', status_start)
          render_tracks = text.find('  const renderTracks = () => (', status_heading)
          if status_start < 0 or status_heading < 0 or render_tracks < 0:
              raise SystemExit('System Status card bounds not found')
          tail_marker = '        </div>\n      </div>\n    </div>\n  );\n\n'
          tail = text.rfind(tail_marker, status_heading, render_tracks)
          if tail < 0:
              raise SystemExit('System Status closing marker not found')
          status_end = tail + len('        </div>\n')
          text = text[:status_start] + text[status_end:]

          settings_start = text.find('        {/* Settings View */}\n')
          player = text.find('      <AudioPlayer onEdit={(track) => setEditingTrack(track)} />')
          if settings_start < 0 or player <= settings_start:
              raise SystemExit('Settings bounds not found')
          settings = """        {/* Settings View */}
          {activeView === "settings" && (
            <div className="p-8 space-y-8 max-w-3xl">
              <div>
                <h1 className="text-3xl font-black tracking-tighter uppercase text-white">System Configuration</h1>
                <p className="text-zinc-500 text-sm mt-1">Configure active workspace preferences.</p>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div className="bg-zinc-950 border border-zinc-900 p-6 rounded-3xl space-y-4">
                  <div>
                    <h3 className="text-sm font-black uppercase tracking-widest text-zinc-300">Demo Mock Data</h3>
                    <p className="text-[11px] text-zinc-550 leading-relaxed font-bold uppercase tracking-wider mt-0.5">Toggle pre-populated sample tracks, clients, playlists, and messages. Turn off to show only your uploaded content.</p>
                  </div>
                  <div className="flex items-center justify-between p-4 bg-zinc-900 rounded-2xl border border-zinc-800">
                    <div className="space-y-1">
                      <p className="text-xs font-bold uppercase tracking-wider">Show Sample Data</p>
                      <p className="text-[10px] text-zinc-550 font-medium">{enableMockData ? "Demo records are visible" : "Only your own content is shown"}</p>
                    </div>
                    <button type="button" onClick={() => setEnableMockData(!enableMockData)} className={cn("w-12 h-6 rounded-full transition-colors relative focus:outline-none cursor-pointer", enableMockData ? "bg-orange-500" : "bg-zinc-800")} aria-pressed={enableMockData} aria-label="Toggle sample data">
                      <div className={cn("absolute top-1 w-4 h-4 bg-black rounded-full transition-transform", enableMockData ? "right-1" : "left-1")} />
                    </button>
                  </div>
                  {!enableMockData && <p className="text-[10px] text-emerald-400 font-black uppercase tracking-widest">✓ Pristine Workspace Enabled</p>}
                </div>
                <div className="bg-zinc-950 border border-zinc-900 p-6 rounded-3xl space-y-4">
                  <h3 className="text-sm font-black uppercase tracking-widest text-zinc-400">System UI Theme</h3>
                  <div className="grid grid-cols-2 gap-3 pt-2">
                    <button type="button" onClick={() => setTheme("dark")} className={cn("p-4 rounded-2xl border text-center", theme === "dark" ? "border-orange-500 text-orange-500" : "border-zinc-900 text-zinc-500")} aria-pressed={theme === "dark"}><Moon className="w-5 h-5 mx-auto mb-2" />CYBERPUNK</button>
                    <button type="button" onClick={() => setTheme("light")} className={cn("p-4 rounded-2xl border text-center", theme === "light" ? "border-orange-500 text-orange-500" : "border-zinc-900 text-zinc-500")} aria-pressed={theme === "light"}><Sun className="w-5 h-5 mx-auto mb-2" />MINIMALIST</button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>

"""
          text = text[:settings_start] + settings + text[player:]
          path.write_text(text)

          for retired in ['src/components/ReleasesHub.tsx', 'src/components/WatermarkRemover.tsx']:
              p = Path(retired)
              if p.exists():
                  p.unlink()
          PY

      - name: Verify cleanup and wiring
        run: |
          node --experimental-strip-types --test src/services/ghostUiCleanup.test.ts
          node --experimental-strip-types --test src/services/buttonAudit.test.ts src/services/trackActionButtons.test.ts
          npm run lint
          npm run build

      - name: Commit verified refactor
        run: |
          rm -f .github/workflows/ghost-ui-cleanup-once.yml
          rm -f .github/workflows/ghost-ui-cleanup-final-once.yml
          rm -f .github/workflows/ghost-ui-cleanup-v3-once.yml
          rm -f .github/workflows/voice-watermark-diagnostic-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor: remove ghost UI and stale settings"
          git push origin HEAD:refactor/remove-ghost-ui-v2
