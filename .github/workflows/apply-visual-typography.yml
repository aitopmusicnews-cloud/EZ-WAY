name: Apply visual typography patch

on:
  push:
    branches:
      - feature/album-cover-visual-typography

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/album-cover-visual-typography
      - name: Apply patch
        run: python tools/apply_visual_typography_patch.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No patch changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/albumCoverStudio.ts src/components/AlbumCoverStudio.tsx album_cover_backend/app/routers/generations.py album_cover_backend/app/font_preview.py
          git commit -m "Implement visual font previews and draggable typography"
          git push origin HEAD:feature/album-cover-visual-typography
