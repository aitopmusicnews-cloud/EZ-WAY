name: Migrate Album Cover Backend into EZ-WAY

on:
  push:
    branches:
      - feature/cloudflare-album-cover-backend
    paths:
      - .github/workflows/album-cover-backend-migrate.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout EZ-WAY branch
        uses: actions/checkout@v4
        with:
          ref: feature/cloudflare-album-cover-backend
          fetch-depth: 0

      - name: Checkout corrected legacy backend source
        uses: actions/checkout@v4
        with:
          repository: aitopmusicnews-cloud/EZ-AI-Album-cover-studio
          ref: main
          path: .legacy-album-cover

      - name: Copy backend into EZ-WAY
        shell: bash
        run: |
          rm -rf album_cover_backend
          mkdir -p album_cover_backend
          rsync -a \
            --exclude '__pycache__/' \
            --exclude '*.pyc' \
            --exclude 'album_cover_studio_backend.egg-info/' \
            --exclude 'app/prompts.py.backup' \
            .legacy-album-cover/backend/ album_cover_backend/
          cp .legacy-album-cover/.env.example album_cover_backend/.env.example
          rm -rf .legacy-album-cover

      - name: Align standalone frontend test with EZ-WAY integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("album_cover_backend/tests/test_pipeline.py")
          source = path.read_text(encoding="utf-8")
          old = '''def test_no_build_frontend_is_served(app_factory):
              client, *_ = app_factory()
              response = client.get("/")
              assert response.status_code == 200
              assert "EZ AI Album Cover Studio" in response.text
              assert "/assets/ez-album-cover-logo.png" in response.text
              assert "/assets/favicon.ico" in response.text
              assert 'id="release-title"' in response.text
              assert 'id="artist-name"' in response.text
              assert 'id="parental-advisory"' in response.text

              logo = client.get("/assets/ez-album-cover-logo.png")
              assert logo.status_code == 200
              assert logo.headers["content-type"] == "image/png"

              favicon = client.get("/assets/favicon.ico")
              assert favicon.status_code == 200
              assert favicon.headers["content-type"] in {"image/vnd.microsoft.icon", "image/x-icon"}
          '''
          old = "\n".join(line[10:] if line.startswith("          ") else line for line in old.splitlines())
          new = '''def test_ezway_backend_is_api_only_without_legacy_frontend(app_factory):
              client, *_ = app_factory()
              response = client.get("/")
              assert response.status_code == 404

              health = client.get("/health")
              assert health.status_code == 200
              assert health.json()["status"] == "ok"
          '''
          new = "\n".join(line[10:] if line.startswith("          ") else line for line in new.splitlines())
          if old not in source:
              raise SystemExit("Expected legacy frontend test block was not found")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r album_cover_backend/requirements.txt

      - name: Compile backend
        working-directory: album_cover_backend
        run: python -m compileall -q app

      - name: Run Cloudflare renderer regression
        working-directory: album_cover_backend
        run: python -m pytest -q tests/test_flux_image_renderer.py

      - name: Run full backend suite
        working-directory: album_cover_backend
        run: python -m pytest -q tests

      - name: Commit migrated backend to EZ-WAY
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add album_cover_backend
          if git diff --cached --quiet; then
            echo "No backend migration changes to commit."
          else
            git commit -m "feat: move Cloudflare album cover backend into EZ-WAY"
            git push origin HEAD:feature/cloudflare-album-cover-backend
          fi
