name: Stable Video Media RED Check

on:
  push:
    branches:
      - fix/stable-media-branding-red
    paths:
      - .github/workflows/stable-video-red.yml

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stable-media-branding-red
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-strip-types --test src/services/videoMediaStability.test.ts
