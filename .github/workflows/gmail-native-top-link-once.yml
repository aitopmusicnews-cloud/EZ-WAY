name: Gmail Native Top Link Once

on:
  push:
    branches:
      - fix/gmail-native-top-link

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/gmail-native-top-link
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply Gmail native top-level link
        run: python scripts/apply-gmail-native-top-link.py

      - name: Install dependencies
        run: npm ci

      - name: Gmail share regression
        run: node --experimental-strip-types --test src/services/shareMessagingActions.test.ts

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit verified fix and remove one-shot files
        run: |
          rm scripts/apply-gmail-native-top-link.py
          rm .github/workflows/gmail-native-top-link-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ShareModal.tsx scripts/apply-gmail-native-top-link.py .github/workflows/gmail-native-top-link-once.yml
          git commit -m "fix: use native top-level Gmail share link"
          git push origin HEAD:fix/gmail-native-top-link
