name: Apply Stable Video Media Fix

on:
  push:
    branches:
      - fix/stable-media-branding-red
    paths:
      - .github/workflows/stable-video-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stable-media-branding-red
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Patch video consumers safely
        shell: python
        run: |
          from pathlib import Path

          def patch(path_name, replacements):
              path = Path(path_name)
              text = path.read_text()
              for label, old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path_name} {label}: expected exactly one match, found {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text)

