              ('audio warning',
               "                     console.warn(\"Audio load failure:\", track.file_url);",
               "                     console.warn(\"Audio load failure:\", resolvedTrackAudioUrl);"),
          ])

          patch('src/components/MusicVideoMaker.tsx', [
              ('imports',
               "import { cn } from '../lib/utils';",
               "import { cn } from '../lib/utils';\nimport { resolveMediaAccess } from '../services/mediaAccess';\nimport { refreshTrackAudioSource } from '../services/trackAudioSource';\nimport { DEFAULT_COVER_ASSET, WATERMARK_ASSET } from '../lib/brandAssets';"),
