      - name: Stable video regression
        run: node --experimental-strip-types --test src/services/videoMediaStability.test.ts
      - name: Existing video playback regression
        run: node --experimental-strip-types --test src/services/videoPlaybackRegression.test.ts
      - name: Focused media regressions
        run: |
          node --experimental-strip-types --test src/services/mediaAccess.test.ts
          node --experimental-strip-types --test src/services/trackAudioSource.test.ts
          node --experimental-strip-types --test src/services/audioPlaybackRefresh.test.ts
          node --experimental-strip-types --test src/services/workspaceMediaRefresh.test.ts
          node --experimental-strip-types --test src/services/mediaStoreStableMedia.test.ts
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit verified source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/VideoPreviewModal.tsx src/components/MusicVideoMaker.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: stabilize video media playback and rendering"
          git push origin HEAD:fix/stable-media-branding-red
