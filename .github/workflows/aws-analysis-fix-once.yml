name: AWS Analysis Fix Once

on:
  push:
    branches:
      - fix/aws-only-track-analysis

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/aws-only-track-analysis

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply AWS-only analysis patch
        run: python scripts/aws_analysis_fix.py

      - name: Install dependencies
        run: npm ci

      - name: AWS-only analysis regression
        run: node --experimental-strip-types --test src/services/awsOnlyTrackAnalysis.test.ts

      - name: Manual analysis contract
        run: node --experimental-strip-types --test src/services/manualTrackAnalysis.test.ts

      - name: Track action wiring
        run: node --experimental-strip-types --test src/services/trackActionButtons.test.ts

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit verified fix and remove one-shot files
        run: |
          rm -f scripts/aws_analysis_fix.py .github/workflows/aws-analysis-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: use AWS Music Intelligence for track analysis"
          git push origin HEAD:fix/aws-only-track-analysis
