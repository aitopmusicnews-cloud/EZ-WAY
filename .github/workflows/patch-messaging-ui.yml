name: Patch messaging UI

on:
  push:
    branches:
      - fix/client-messaging-attachments

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply deterministic messaging UI patch
        run: python scripts/patch_messaging_ui.py
      - name: Verify backend messaging contracts
        run: node --test aws/app-data/api/contract.test.mjs aws/app-data/api/rows.test.mjs aws/app-data/api/storage.test.mjs
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Commit patched UI files
        run: |
          if git diff --quiet -- src/App.tsx src/context/MediaStoreContext.tsx src/components/SharePortal.tsx; then
            echo "UI files already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/context/MediaStoreContext.tsx src/components/SharePortal.tsx
          git commit -m "feat: enable live client messaging attachments"
          git push origin HEAD:fix/client-messaging-attachments
