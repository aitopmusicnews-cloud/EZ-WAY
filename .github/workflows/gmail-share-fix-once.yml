name: Gmail Share Fix Once

on:
  push:
    branches:
      - fix/gmail-share-launch

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/gmail-share-launch
          fetch-depth: 0

      - name: Apply Gmail share fix
        run: python scripts/apply-gmail-share-fix.py

      - name: Install dependencies
        run: npm ci

      - name: Verify Gmail share regression
        run: node --experimental-strip-types --test src/services/shareMessagingActions.test.ts

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit verified fix
        run: |
          rm scripts/apply-gmail-share-fix.py .github/workflows/gmail-share-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ShareModal.tsx scripts/apply-gmail-share-fix.py .github/workflows/gmail-share-fix-once.yml
          git commit -m "Fix Gmail share navigation"
          git push origin HEAD:fix/gmail-share-launch
