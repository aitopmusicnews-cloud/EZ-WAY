name: Apply Album Cover Custom Fonts

on:
  push:
    branches:
      - feature/album-cover-custom-fonts

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/album-cover-custom-fonts
          fetch-depth: 0
      - name: Apply font wiring
        run: python scripts/apply-album-cover-custom-fonts.py
      - name: Remove temporary patch files
        run: rm scripts/apply-album-cover-custom-fonts.py .github/workflows/apply-custom-fonts.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add approved Album Cover custom fonts"
          git push origin HEAD:feature/album-cover-custom-fonts
