name: Patch YouTube Lyrics SEO Server

on:
  push:
    branches:
      - feat/youtube-lyrics-seo
    paths:
      - '.github/workflows/patch-youtube-lyrics-server.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/youtube-lyrics-seo
          fetch-depth: 0

      - name: Patch lyric SEO integration
        shell: python
        run: |
          from pathlib import Path

          server_path = Path('server.ts')
          server = server_path.read_text()
          start_marker = '  // 5. AI COPYWRITER: Generate YouTube SEO Meta'
          end_marker = '  // 6. COMMENT ASSISTANT: Generate reply drafts with style'
          start = server.index(start_marker)
          end = server.index(end_marker, start)
          route = server[start:end]

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Could not locate {label}')
              return text.replace(old, new, 1)

          route = replace_once(
              route,
              '      spotifyLink,\n      appleLink,\n      instagramHandle,',
              '      spotifyLink,\n      appleLink,\n      amazonLink,\n      instagramHandle,',
              'YouTube metadata link destructuring',
          )

          prompt_anchor = '      let prompt = "";\n'
          lyric_rules = '''      const lyricDescriptionRules = `\nLYRIC VIDEO DESCRIPTION REQUIREMENTS:\n- The first 2 lines must identify Song Title, Artist, and Genre, then give an engaging lyric-search hook.\n- STREAMING SECTION: include Spotify, Apple Music, and Amazon Music. Preserve supplied URLs; otherwise keep clear editable placeholders.\n- LYRICS SECTION: include the complete supplied lyrics exactly. Never summarize or truncate supplied lyrics. If lyrics are unavailable, use [PASTE_LYRICS_HERE].\n- CREDITS: include Producer: [Producer], Songwriter(s): [Songwriters], and Vocalist(s): [Vocalists].\n- Prioritize lyric search intent and lyric-specific terms such as lyrics, lyric video, lyrics video, sing along, and clean lyrics alongside the genre.\n- Treat this as a completed artist release, never a beat for sale.\n`;\n'''
          route = replace_once(route, prompt_anchor, prompt_anchor + lyric_rules, 'YouTube metadata prompt anchor')

          route = replace_once(
              route,
              '- Provided Apple Music Link: "${appleLink || ""}"\n',
              '- Provided Apple Music Link: "${appleLink || ""}"\n- Provided Amazon Music Link: "${amazonLink || ""}"\n',
              'local Amazon Music prompt field',
          )
          route = replace_once(
              route,
              '- Apple Music Link: "${appleLink || ""}"\n',
              '- Apple Music Link: "${appleLink || ""}"\n- Amazon Music Link: "${amazonLink || ""}"\n',
              'track Amazon Music prompt field',
          )
          route = replace_once(
              route,
              'Spotify: ${spotifyLink || "link"}, Apple Music: ${appleLink || "link"}, Instagram: @${instagramHandle || "profile"}',
              'Spotify: ${spotifyLink || "link"}, Apple Music: ${appleLink || "link"}, Amazon Music: ${amazonLink || "link"}, Instagram: @${instagramHandle || "profile"}',
              'local streaming link instruction',
          )
          route = replace_once(
              route,
              'Spotify: ${spotifyLink || "not provided"}, Apple Music: ${appleLink || "not provided"}, Instagram: @${instagramHandle || "not provided"}',
              'Spotify: ${spotifyLink || "not provided"}, Apple Music: ${appleLink || "not provided"}, Amazon Music: ${amazonLink || "not provided"}, Instagram: @${instagramHandle || "not provided"}',
              'track streaming link instruction',
          )

          route = replace_once(
              route,
              'Please generate and optimize:\n',
              '${lyricDescriptionRules}\n\nPlease generate and optimize:\n',
              'local metadata generation instructions',
          )
          route = replace_once(
              route,
              'Please generate:\n',
              '${lyricDescriptionRules}\n\nPlease generate:\n',
              'track metadata generation instructions',
          )

          old_system = 'systemInstruction: "You are a platinum-selling music marketing copywriter and elite music media agent specializing in YouTube SEO branding for artist song releases across hip-hop, trap, lofi, electronic, drill, pop, and acoustic indie productions. You write highly customized, authentic, and evocative promotional metadata that perfectly aligns with the specific subgenre, emotional vibe, and instrumentation. CRITICAL: These tracks are full, completed artist songs/releases with vocals. You must never write copy that tries to sell or lease background beats, or licenses, nor mention \'licensing\', \'leases\', \'selling beats\', or \'beat catalog\'. Instead, promote the track as a completed masterpiece for fans to stream (on Spotify, Apple, etc.), playlist curators to feature, blogs to review, and TikTok/reels to use. Return direct JSON with title, description, tags, and growthInsights properties as specified.",'
          new_system = 'systemInstruction: "You are an expert YouTube Music SEO assistant specializing in Lyric Channels. Generate metadata for full, completed artist songs with lyrics. The description must follow the first 2 lines, STREAMING SECTION, LYRICS SECTION, and CREDITS rules in the user prompt; preserve all supplied lyrics without truncation; include Spotify, Apple Music, and Amazon Music; include Producer, Songwriter(s), and Vocalist(s) credit lines; prioritize lyric-search intent; never market a beat for sale. Return direct JSON with title, description, tags, and growthInsights properties as specified.",'
          route = replace_once(route, old_system, new_system, 'old YouTube Gemini system instruction')

          required = [
              'YouTube Music SEO assistant specializing in Lyric Channels',
              'LYRICS SECTION',
              'first 2 lines',
              'Amazon Music',
              'Producer: [Producer]',
              'Songwriter(s): [Songwriters]',
              'Vocalist(s): [Vocalists]',
              'amazonLink',
          ]
          for marker in required:
              if marker not in route:
                  raise SystemExit(f'Missing required server marker after patch: {marker}')
          server_path.write_text(server[:start] + route + server[end:])

          browser_path = Path('src/services/youtubeBrowser.ts')
          browser = browser_path.read_text()
          constants_anchor = "export const YOUTUBE_TOKEN_STORAGE_KEY = 'EZWAY_YOUTUBE_OAUTH_TOKEN';\n"
          browser_setter = "\nlet youtubeAmazonMusicLink = '';\nexport const setYouTubeBrowserAmazonMusicLink = (value: string) => {\n  youtubeAmazonMusicLink = String(value || '').trim();\n};\n"
          if 'setYouTubeBrowserAmazonMusicLink' not in browser:
              browser = replace_once(browser, constants_anchor, constants_anchor + browser_setter, 'YouTube browser constants')

          bridge_anchor = "      if (path === '/api/youtube/disconnect' && method === 'POST') {\n"
          bridge_code = "      if (path === '/api/youtube/generate-meta' && method === 'POST') {\n        const body = await readJsonBody();\n        const headers = new Headers(init?.headers || {});\n        headers.set('Content-Type', 'application/json');\n        return nativeFetch(input, {\n          ...init,\n          method: 'POST',\n          headers,\n          body: JSON.stringify({ ...body, amazonLink: youtubeAmazonMusicLink }),\n        });\n      }\n"
          if "path === '/api/youtube/generate-meta'" not in browser:
              browser = replace_once(browser, bridge_anchor, bridge_code + bridge_anchor, 'YouTube fetch bridge insertion point')
          browser_path.write_text(browser)

          hub_path = Path('src/components/YouTubeHub.tsx')
          hub = hub_path.read_text()
          import_anchor = '  preloadGoogleIdentityServices,\n  YOUTUBE_OAUTH_SENTINEL_URL,\n'
          if 'setYouTubeBrowserAmazonMusicLink' not in hub:
              hub = replace_once(
                  hub,
                  import_anchor,
                  '  preloadGoogleIdentityServices,\n  setYouTubeBrowserAmazonMusicLink,\n  YOUTUBE_OAUTH_SENTINEL_URL,\n',
                  'YouTube Hub browser import list',
              )
          setter_anchor = '          setYouTubeAmazonMusicLink(value);\n'
          if '          setYouTubeBrowserAmazonMusicLink(value);\n' not in hub:
              hub = replace_once(
                  hub,
                  setter_anchor,
                  setter_anchor + '          setYouTubeBrowserAmazonMusicLink(value);\n',
                  'Amazon Music onChange setter',
              )
          hub_path.write_text(hub)

      - name: Verify patch markers
        run: |
          grep -q "YouTube Music SEO assistant specializing in Lyric Channels" server.ts
          grep -q "setYouTubeBrowserAmazonMusicLink" src/services/youtubeBrowser.ts
          grep -q "amazonLink: youtubeAmazonMusicLink" src/services/youtubeBrowser.ts
          grep -q "setYouTubeBrowserAmazonMusicLink" src/components/YouTubeHub.tsx

      - name: Commit server and bridge patch
        run: |
          git config user.name "aitopmusicnews-cloud"
          git config user.email "aitopmusicnews@gmail.com"
          git rm .github/workflows/patch-youtube-lyrics-server.yml
          git add server.ts src/services/youtubeBrowser.ts src/components/YouTubeHub.tsx
          git commit -m "feat: make YouTube AI metadata lyrics-focused"
          git push origin HEAD:feat/youtube-lyrics-seo
