name: Patch media CORS templates

on:
  push:
    branches:
      - fix/audio-tools-s3-cors
    paths:
      - .github/workflows/patch-media-cors.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/audio-tools-s3-cors
          fetch-depth: 0
      - name: Patch templates
        run: python scripts/_patch_media_cors.py
      - name: Commit product changes and cleanup
        run: |
          rm .github/workflows/patch-media-cors.yml scripts/_patch_media_cors.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aws/app-data/template.yaml aws/audio-tools/template.yaml .github/workflows/patch-media-cors.yml scripts/_patch_media_cors.py
          git commit -m "fix: make media CORS durable"
          git push origin HEAD:fix/audio-tools-s3-cors
