name: Local Lyric Optimizer Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - 'local_lyric_optimizer/**'
      - 'src/services/localLyricOptimizer.ts'
      - 'src/services/localLyricOptimizer.test.ts'
      - 'src/services/browserAudioTools.ts'
      - 'src/services/browserAudioTools.test.ts'
      - 'src/services/trackActionButtons.test.ts'
      - 'src/components/TrackOptionsMenu.tsx'
      - 'src/components/YouTubeHub.tsx'
      - 'src/services/youtubeLyricsSeo.test.ts'
      - 'src/services/youtubeSeoQuality.test.ts'
      - 'src/services/youtubeBrowser.ts'
      - 'src/services/youtubeBrowser.test.ts'
      - 'src/services/youtubeUploadCore.ts'
      - 'src/services/youtubeUploadCore.test.ts'
      - 'src/services/stemsWorkerClient.ts'
      - 'src/services/stemsWorkerClient.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/local-lyric-optimizer-verify.yml'
  workflow_dispatch:

jobs:
  verify-local-lyric-optimizer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r local_lyric_optimizer/requirements.txt pytest httpx

      - name: Install frontend dependencies
        run: npm ci

      - name: Local optimizer Python suite
        run: python -m pytest local_lyric_optimizer/tests -q

      - name: Local optimizer browser client
        run: node --experimental-strip-types --test src/services/localLyricOptimizer.test.ts

      - name: Browser Audio Tools lyric integration
        run: node --experimental-strip-types --test src/services/browserAudioTools.test.ts

      - name: Browser stem worker regression
        run: node --experimental-strip-types --test src/services/stemsWorkerClient.test.ts

      - name: Track action copy
        run: node --experimental-strip-types --test src/services/trackActionButtons.test.ts

      - name: YouTube lyric SEO integration
        run: node --experimental-strip-types --test src/services/youtubeLyricsSeo.test.ts

      - name: YouTube SEO quality regression
        run: node --experimental-strip-types --test src/services/youtubeSeoQuality.test.ts

      - name: YouTube OAuth bridge regression
        run: node --experimental-strip-types --test src/services/youtubeBrowser.test.ts

      - name: YouTube upload SEO regression
        run: node --experimental-strip-types --test src/services/youtubeUploadCore.test.ts

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build
