name: Album Cover Integration Once

on:
  push:
    branches:
      - fix/gmail-native-top-link

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/gmail-native-top-link
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply Edit Metadata cleanup
        run: python scripts/apply-album-cover-integration.py

      - name: Install dependencies
        run: npm ci

      - name: Album Cover integration regression
        run: node --experimental-strip-types --test src/services/albumCoverIntegration.test.ts

      - name: Existing Album Cover tests
        run: |
          node --experimental-strip-types --test src/services/albumCoverCore.test.ts
          node --experimental-strip-types --test src/services/albumCoverTitleFont.test.ts

      - name: Gmail share regression
        run: node --experimental-strip-types --test src/services/shareMessagingActions.test.ts

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit verified implementation and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/apply-album-cover-integration.py .github/workflows/album-cover-integration-once.yml
          git add src/components/EditTrackModal.tsx scripts/apply-album-cover-integration.py .github/workflows/album-cover-integration-once.yml
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit"
          else
            git commit -m "refactor: remove Edit Metadata cover generator"
            git push origin HEAD:fix/gmail-native-top-link
          fi
