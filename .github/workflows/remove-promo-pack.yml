name: Remove unused Promo Pack feature

on:
  push:
    branches:
      - cleanup/remove-promo-pack
    paths:
      - .github/workflows/remove-promo-pack.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: cleanup/remove-promo-pack

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Remove Promo Pack runtime code
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app = Path('src/App.tsx')
          text = app.read_text()
          text = text.replace('import PromoPackModal from "./components/PromoPackModal";\n', '')
          text, state_count = re.subn(r'\n  const \[selectedTrackForPromo, setSelectedTrackForPromo\] =\s*\n?\s*useState<Track \| null>\(null\);', '', text)
          if state_count != 1:
              raise SystemExit(f'Expected one Promo Pack state block, found {state_count}')
          text, callback_count = re.subn(r'^\s*onCreatePromo=\{\(\) => setSelectedTrackForPromo\(track\)\}\s*\n', '', text, flags=re.M)
          if callback_count < 1:
              raise SystemExit('No Promo Pack callbacks found in App.tsx')
          text, modal_count = re.subn(r'\n\s*\{selectedTrackForPromo && \(\s*\n\s*<PromoPackModal\s*\n\s*key="promo-pack-modal"\s*\n\s*track=\{selectedTrackForPromo\}\s*\n\s*onClose=\{\(\) => setSelectedTrackForPromo\(null\)\}\s*\n\s*/>\s*\n\s*\)\}', '', text, flags=re.S)
          if modal_count != 1:
              raise SystemExit(f'Expected one Promo Pack modal block, found {modal_count}')
          app.write_text(text)

          menu = Path('src/components/TrackOptionsMenu.tsx')
          text = menu.read_text()
          text = text.replace('  Plus,\n', '')
          text = text.replace('  onCreatePromo: () => void;\n', '')
          text = text.replace('  onCreatePromo,\n', '')
          text, menu_count = re.subn(r'\n\s*<button onClick=\{\(\) => \{ onCreatePromo\(\); setIsOpen\(false\); \}\}[^>]*>\s*\n\s*<Plus[^>]* /> Marketing Pack\s*\n\s*</button>', '', text, flags=re.S)
          if menu_count != 1:
              raise SystemExit(f'Expected one Marketing Pack menu action, found {menu_count}')
          menu.write_text(text)

          store = Path('src/services/dataStore.ts')
          text = store.read_text()
          text, interface_count = re.subn(r'\nexport interface PromoPackPayload \{.*?\n\}\n', '\n', text, flags=re.S)
          if interface_count != 1:
              raise SystemExit(f'Expected one PromoPackPayload interface, found {interface_count}')
          text = text.replace('      deletePromoVideo: configurationError, getPromoPack: configurationError, putPromoPack: configurationError,\n', '      deletePromoVideo: configurationError,\n')
          text, method_count = re.subn(r"\n    getPromoPack: \(trackId: string\).*?\n\n    async uploadFile", '\n\n    async uploadFile', text, flags=re.S)
          if method_count != 1:
              raise SystemExit(f'Expected one Promo Pack dataStore method block, found {method_count}')
          store.write_text(text)

          contract = Path('aws/app-data/api/contract.mjs')
          text = contract.read_text()
          text, contract_count = re.subn(r"\n    case 'promo_packs': return \{.*?\n    \};", '', text, flags=re.S)
          if contract_count != 1:
              raise SystemExit(f'Expected one promo_packs contract, found {contract_count}')
          contract.write_text(text)

          contract_test = Path('aws/app-data/api/contract.test.mjs')
          text = contract_test.read_text()
          text, contract_test_count = re.subn(r"\n\ntest\('promo packs validate track ownership keys and copy payloads'.*?\n\}\);\n?", '\n', text, flags=re.S)
          if contract_test_count != 1:
              raise SystemExit(f'Expected one promo pack contract test, found {contract_test_count}')
          contract_test.write_text(text)

          handler = Path('aws/app-data/api/handler.mjs')
          text = handler.read_text()
          text = text.replace("'messages', 'promo_videos', 'promo_packs', 'profiles'", "'messages', 'promo_videos', 'profiles'")
          text, helper_count = re.subn(r'\nasync function normalizePromoPackTrackId\(trackId\) \{.*?\n\}\n\nasync function loadShare', '\nasync function loadShare', text, flags=re.S)
          if helper_count != 1:
              raise SystemExit(f'Expected one Promo Pack helper block, found {helper_count}')
          text, route_count = re.subn(r'\n\s*const promoPackMatch = rawPath\.match\(.*?\n\s*\}', '', text, flags=re.S)
          if route_count != 1:
              raise SystemExit(f'Expected one Promo Pack route block, found {route_count}')
          handler.write_text(text)

          gemini = Path('src/services/geminiService.ts')
          text = gemini.read_text()
          text, gemini_count = re.subn(r'\nexport async function generatePromoPack\(trackInfo: any\) \{.*\Z', '\n', text, flags=re.S)
          if gemini_count != 1:
              raise SystemExit(f'Expected one generatePromoPack function, found {gemini_count}')
          gemini.write_text(text)

          server = Path('server.ts')
          text = server.read_text()
          start = text.find('  // API - Generate Promo Pack\n')
          end_marker = '  // Vite middleware for development vs static asset serving for production\n'
          end = text.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('Could not locate Promo Pack endpoint boundaries in server.ts')
          server.write_text(text[:start] + text[end:])

          ci = Path('.github/workflows/music-intelligence-verify.yml')
          text = ci.read_text()
          text, ci_count = re.subn(r'\n      - name: Promo Pack AWS persistence regression\n        run: node --experimental-strip-types --test src/services/promoPackAws\.test\.ts\n', '', text)
          if ci_count != 1:
              raise SystemExit(f'Expected one Promo Pack CI step, found {ci_count}')
          ci.write_text(text)
          PY

          rm -f src/components/PromoPackModal.tsx src/services/promoPackAws.test.ts

      - name: Verify dead feature references are gone
        shell: bash
        run: |
          ! grep -R -n -E 'PromoPackModal|selectedTrackForPromo|onCreatePromo|generatePromoPack|/api/generate-promo|/promo-packs|Promo Pack AWS persistence|Marketing Pack' src server.ts aws/app-data/api .github/workflows/music-intelligence-verify.yml

      - name: Install dependencies
        run: npm ci

      - name: Install AWS app-data Lambda dependencies
        run: npm install --prefix aws/app-data/api --ignore-scripts --no-audit --no-fund

      - name: AWS app-data tests
        run: node --test aws/app-data/api/contract.test.mjs aws/app-data/api/rows.test.mjs aws/app-data/api/storage.test.mjs

      - name: Data store tests
        run: node --experimental-strip-types --test src/services/dataStore.test.ts

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "aitopmusicnews-cloud"
          git config user.email "aitopmusicnews@gmail.com"
          git add -A
          git commit -m "Remove unused Promo Pack feature"
          git push origin HEAD:cleanup/remove-promo-pack
