name: Music Intelligence Feature Verification

on:
  push:
    branches:
      - feature/music-intelligence-analyzer
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply YouTube track dropdown implementation
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/youtube-track-dropdown'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/YouTubeHub.tsx')
          text = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'Could not locate {label}')
              text = text.replace(old, new, 1)

          replace_once(
              'import { useMediaStore } from "../context/MediaStoreContext";\n',
              'import { useMediaStore } from "../context/MediaStoreContext";\nimport { promoVideosForTrack } from "../services/youtubeUploadCore";\n',
              'YouTube upload helper import',
          )

          replace_once(
              '    const [selectedVideoId, setSelectedVideoId] = useState<string>("");\n',
              '    const [selectedTrackId, setSelectedTrackId] = useState<string>("");\n    const [selectedVideoId, setSelectedVideoId] = useState<string>("");\n',
              'selected track state',
          )

          replace_once(
              '    const [videoPreviewUrl, setVideoPreviewUrl] = useState<string>("");\n',
              '    const [videoPreviewUrl, setVideoPreviewUrl] = useState<string>("");\n    const filteredPromoVideos = promoVideosForTrack(promoVideos, selectedTrackId);\n',
              'filtered promo videos',
          )

          replace_once(
              '    // Automatically fill title & AI description when track asset selected\n    const handleAssetSelect = (videoId: string) => {\n',
              '    const handleTrackSelect = (trackId: string) => {\n        setSelectedTrackId(trackId);\n        setSelectedVideoId("");\n        setIsPlayingVideo(false);\n        setVideoTitle("");\n        setVideoDescription("");\n        setVideoTags("");\n        setAiGrowthInsights([]);\n    };\n\n    // Automatically fill title & AI description when track asset selected\n    const handleAssetSelect = (videoId: string) => {\n',
              'track selection handler',
          )

          replace_once(
              '                                onClick={() => {\n                                    setUploadSource("local");\n                                    setSelectedVideoId("");\n',
              '                                onClick={() => {\n                                    setUploadSource("local");\n                                    setSelectedTrackId("");\n                                    setSelectedVideoId("");\n',
              'local source reset',
          )

          replace_once(
              '            setUploadProgress(null);\n            setSelectedVideoId("");\n',
              '            setUploadProgress(null);\n            setSelectedTrackId("");\n            setSelectedVideoId("");\n',
              'publish form reset',
          )

          old_dropdown = '''                            {uploadSource === "studio" ? (
                                <div className="space-y-2">
                                    <label className="text-[10px] font-black uppercase tracking-wider text-zinc-400 font-mono block">
                                        1. Choose Complete Promo Video Rendering
                                    </label>
                                    <select
                                        value={selectedVideoId}
                                        onChange={(e) => handleAssetSelect(e.target.value)}
                                        className="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3.5 text-xs text-white focus:outline-none focus:border-orange-500 cursor-pointer font-sans"
                                    >
                                        <option value="" className="text-zinc-600">-- Click to pick an AI promo visualizer file --</option>
                                        {promoVideos.map(video => {
                                            const t = tracks.find(track => track.id === video.track_id);
                                            const p = playlists.find(pl => pl.id === video.playlist_id);
                                            const ref = t?.name || p?.name || "Render Asset";
                                            return (
                                                <option key={video.id} value={video.id}>
                                                    {ref} ({video.style} - {video.aspectRatio || "Aspect 16:9"})
                                                </option>
                                            );
                                        })}
                                    </select>
                                </div>
                            ) : (
'''

          new_dropdown = '''                            {uploadSource === "studio" ? (
                                <div className="space-y-4">
                                    <div className="space-y-2">
                                        <label className="text-[10px] font-black uppercase tracking-wider text-zinc-400 font-mono block">
                                            1. Select Track
                                        </label>
                                        <select
                                            value={selectedTrackId}
                                            onChange={(e) => handleTrackSelect(e.target.value)}
                                            className="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3.5 text-xs text-white focus:outline-none focus:border-orange-500 cursor-pointer font-sans"
                                        >
                                            <option value="" className="text-zinc-600">-- Select an EZ-WAY track --</option>
                                            {tracks.map(track => (
                                                <option key={track.id} value={track.id}>
                                                    {track.name} — {track.artist || "Unknown Artist"}
                                                </option>
                                            ))}
                                        </select>
                                    </div>

                                    <div className="space-y-2">
                                        <label className="text-[10px] font-black uppercase tracking-wider text-zinc-400 font-mono block">
                                            2. Choose Complete Promo Video Rendering
                                        </label>
                                        <select
                                            value={selectedVideoId}
                                            onChange={(e) => handleAssetSelect(e.target.value)}
                                            disabled={!selectedTrackId}
                                            className="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3.5 text-xs text-white focus:outline-none focus:border-orange-500 cursor-pointer font-sans disabled:opacity-50 disabled:cursor-not-allowed"
                                        >
                                            <option value="" className="text-zinc-600">
                                                {selectedTrackId ? "-- Pick a promo video for this track --" : "-- Select a track first --"}
                                            </option>
                                            {filteredPromoVideos.map(video => (
                                                <option key={video.id} value={video.id}>
                                                    {video.name || video.title || "Promo Video"} ({video.style || "Visualizer"})
                                                </option>
                                            ))}
                                            {selectedTrackId && filteredPromoVideos.length === 0 && (
                                                <option value="" disabled>No promo videos available for this track</option>
                                            )}
                                        </select>
                                    </div>
                                </div>
                            ) : (
'''

          replace_once(old_dropdown, new_dropdown, 'YouTube studio dropdown block')
          path.write_text(text)
          PY

          if git diff --quiet -- src/components/YouTubeHub.tsx; then
            echo "YouTube track dropdown already applied."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/YouTubeHub.tsx
          git commit -m "feat: add track dropdown to YouTube upload"
          git push origin HEAD:"$HEAD_REF"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Music Intelligence core tests
        run: node --experimental-strip-types --test src/services/musicIntelligenceCore.test.ts

      - name: Copyrights core tests
        run: node --experimental-strip-types --test src/services/copyrightsCore.test.ts

      - name: Albumcover Studio core tests
        run: node --experimental-strip-types --test src/services/albumCoverCore.test.ts

      - name: Albumcover title and font tests
        run: node --experimental-strip-types --test src/services/albumCoverTitleFont.test.ts

      - name: YouTube upload dropdown tests
        run: node --experimental-strip-types --test src/services/youtubeUploadCore.test.ts

      - name: Python core tests
        run: python -m unittest discover -s modal -p 'test_music_intelligence_core.py' -v

      - name: Python syntax check
        run: python -m py_compile modal/audio_tools_agent_v5.py modal/music_intelligence_core.py

      - name: AWS Lambda syntax check
        run: node --check aws/music-intelligence/handler.mjs

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build
