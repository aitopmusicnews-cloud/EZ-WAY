name: Music Intelligence Feature Verification

on:
  push:
    branches:
      - feature/music-intelligence-analyzer
      - feature/aws-music-intelligence
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Music Intelligence core tests
        run: node --experimental-strip-types --test src/services/musicIntelligenceCore.test.ts

      - name: Copyrights core tests
        run: node --experimental-strip-types --test src/services/copyrightsCore.test.ts

      - name: Albumcover Studio core tests
        run: node --experimental-strip-types --test src/services/albumCoverCore.test.ts

      - name: Albumcover title and font tests
        run: node --experimental-strip-types --test src/services/albumCoverTitleFont.test.ts

      - name: YouTube upload dropdown tests
        run: node --experimental-strip-types --test src/services/youtubeUploadCore.test.ts

      - name: AWS Audio Tools job contract tests
        run: node --test aws/audio-tools/api/jobContract.test.mjs

      - name: AWS Music Intelligence core tests
        run: python -m unittest discover -s aws/audio-tools/worker -p 'test_music_intelligence_core.py' -v

      - name: AWS worker syntax check
        run: python -m py_compile aws/audio-tools/worker/*.py

      - name: AWS API syntax check
        run: node --check aws/audio-tools/api/handler.mjs aws/audio-tools/api/jobContract.mjs aws/music-intelligence/handler.mjs

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build
