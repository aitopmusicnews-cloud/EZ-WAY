name: Music Intelligence Feature Verification

on:
  push:
    branches:
      - feature/music-intelligence-analyzer
      - feature/aws-music-intelligence
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Music Intelligence core tests
        run: node --experimental-strip-types --test src/services/musicIntelligenceCore.test.ts

      - name: AWS Music Intelligence frontend tests
        run: node --experimental-strip-types --test src/services/musicIntelligenceAws.test.ts

      - name: Copyrights core tests
        run: node --experimental-strip-types --test src/services/copyrightsCore.test.ts

      - name: Albumcover Studio core tests
        run: node --experimental-strip-types --test src/services/albumCoverCore.test.ts

      - name: Albumcover title and font tests
        run: node --experimental-strip-types --test src/services/albumCoverTitleFont.test.ts

      - name: YouTube upload dropdown tests
        run: node --experimental-strip-types --test src/services/youtubeUploadCore.test.ts

      - name: AWS Audio Tools job contract tests
        run: node --test aws/audio-tools/api/jobContract.test.mjs

      - name: AWS app data API tests
        run: node --test aws/app-data/api/contract.test.mjs aws/app-data/api/rows.test.mjs aws/app-data/api/storage.test.mjs

      - name: AWS worker tests
        run: python -m unittest discover -s aws/audio-tools/worker -p 'test_*.py' -v

      - name: AWS worker syntax check
        run: python -m py_compile aws/audio-tools/worker/*.py

      - name: AWS API syntax check
        run: node --check aws/audio-tools/api/handler.mjs aws/audio-tools/api/jobContract.mjs aws/music-intelligence/handler.mjs aws/app-data/api/db.mjs aws/app-data/api/contract.mjs aws/app-data/api/handler.mjs aws/app-data/api/rows.mjs aws/app-data/api/storage.mjs aws/app-data/scripts/migrate.mjs

      - name: AWS infrastructure lint
        run: |
          python -m pip install --quiet cfn-lint
          cfn-lint aws/audio-tools/template.yaml
          cfn-lint aws/app-data/template.yaml

      - name: AWS deployment script syntax check
        run: bash -n aws/audio-tools/deploy.sh

      - name: No Modal production runtime references
        run: |
          test ! -d modal
          ! grep -R -E 'modal\.run|modal deploy' AUDIO_TOOLS.md src aws/audio-tools

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build
