name: Remove orphan Promo Pack helper

on:
  push:
    branches:
      - cleanup/remove-promo-pack
    paths:
      - .github/workflows/remove-promo-helper.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-promo-pack
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Remove orphan helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server.ts')
          text = p.read_text()
          start_marker = '  // Helper function for high-fidelity genre-specific mock promo packs\n'
          end_marker = '  // Vite middleware for development vs static asset serving for production\n'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('Could not locate orphan Promo Pack helper boundaries')
          p.write_text(text[:start] + text[end:])
          PY
          ! grep -n -E 'getMockPromoPack|mock promo packs' server.ts
      - name: Verify TypeScript
        run: npm ci && npm run lint
      - name: Verify production build
        run: npm run build
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "aitopmusicnews-cloud"
          git config user.email "aitopmusicnews@gmail.com"
          git add server.ts
          git commit -m "Remove orphan Promo Pack helper"
          git push origin HEAD:cleanup/remove-promo-pack
