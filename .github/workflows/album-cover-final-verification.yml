name: Album Cover Final Verification

on:
  push:
    branches:
      - feature/album-cover-major-label-director

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/album-cover-major-label-director
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: album_cover_backend/requirements.txt
      - name: Install frontend dependencies
        run: npm ci
      - name: Install backend dependencies
        run: python -m pip install -q -r album_cover_backend/requirements.txt
      - name: Album Cover integration regression
        run: node --experimental-strip-types --test src/services/albumCoverIntegration.test.ts
      - name: Frontend lint
        run: npm run lint
      - name: Frontend production build
        run: npm run build
      - name: Full Album Cover backend suite
        working-directory: album_cover_backend
        run: python -m pytest -q
      - name: Backend compile
        working-directory: album_cover_backend
        run: python -m compileall -q app
      - name: Production provider isolation
        run: |
          ! grep -E "GeminiCreativeDirector|GeminiConceptRanker|GeminiCoverCritic|OpenAI" album_cover_backend/app/main.py
          ! grep -R -E "pollinations\.ai|Pollinations" album_cover_backend/app/main.py album_cover_backend/app/cloudflare_generation_service.py album_cover_backend/app/cloudflare_creative_director.py album_cover_backend/app/render_prompts.py
      - name: Remove temporary verification workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/album-cover-final-verification.yml
          git commit -m "chore: remove temporary album cover verification workflow"
          git push origin HEAD:feature/album-cover-major-label-director
